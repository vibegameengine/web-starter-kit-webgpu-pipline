<!doctype html>
<html>
  <head><meta charset="UTF-8" /><title>webgpu test</title>
  <style>html,body{margin:0;height:100%}#app{position:fixed;inset:0}</style></head>
  <body>
    <div id="app"></div>
    <script type="module">
      import * as THREE from 'three/webgpu';

      const container = document.getElementById('app');
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      await renderer.init();
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x334455);
      const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(3, 3, 5);
      camera.lookAt(0, 0, 0);

      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(2, 2, 2),
        new THREE.MeshStandardMaterial({ color: 0xff8844 }),
      );
      scene.add(cube);
      scene.add(new THREE.DirectionalLight(0xffffff, 3));
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));

      const perf = { fps: 60, backend: renderer.backend.constructor.name, webgpu: !!navigator.gpu };
      renderer.setAnimationLoop(() => {
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);
      });
      Object.assign(window, { __perf: perf });
    </script>
  </body>
</html>
