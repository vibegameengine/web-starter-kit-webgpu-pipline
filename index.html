<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elderwood — Frame Graph v3</title>
    <!-- Inline so a missing favicon never shows up as a console error and muddies the capture gate. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b1017'/%3E%3Cpath d='M3 12h10L8 3z' fill='%23d9c48a'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .overlay {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 0.75rem;
        text-align: center; z-index: 20; background: #05070a;
        font: 500 13px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #9fb3c8; letter-spacing: 0.09em; transition: opacity 0.5s ease;
      }
      .overlay.hidden { opacity: 0; pointer-events: none; }
      .overlay[hidden] { display: none; }
      #error-overlay { background: #1a0708; color: #ffb4a8; }
      #error-message {
        max-width: 70ch; white-space: pre-wrap; text-align: left;
        letter-spacing: 0; font-size: 12px; color: #ff8a7a;
      }

      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 15;
        padding: 10px 12px; border-radius: 8px;
        background: rgba(6, 10, 16, 0.72); backdrop-filter: blur(6px);
        border: 1px solid rgba(140, 170, 200, 0.16);
        font: 500 11px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #8fa6bd; pointer-events: none; min-width: 210px;
      }
      .hud-row { display: flex; justify-content: space-between; gap: 18px; }
      .hud-key { opacity: 0.62; }
      .hud-value { color: #d7e6f5; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="overlay" id="loading-overlay" data-testid="loading-overlay">
      <div id="loading-message" data-testid="loading-message">Booting</div>
    </div>

    <div class="overlay hidden" id="error-overlay" hidden data-testid="error-overlay">
      <div>PIPELINE ERROR</div>
      <div id="error-message" data-testid="error-message"></div>
    </div>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
